# The site is plain static files. TLS is expected to terminate upstream
# (Caddy, Traefik, a load balancer), which is why nothing here listens on 443.

map $sent_http_content_type $cache_control {
    default                    "public, max-age=3600";
    ~image/                    "public, max-age=31536000, immutable";
    ~font/                     "public, max-age=31536000, immutable";
    "text/css"                 "public, max-age=31536000, immutable";
    "application/javascript"   "public, max-age=31536000, immutable";
    "text/html"                "public, max-age=0, must-revalidate";
}

gzip              on;
gzip_vary         on;
gzip_min_length   512;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml application/javascript
                  application/json image/svg+xml application/xml+rss;

# ---------------------------------------------------------------- arcanebyte
server {
    listen      80 default_server;
    server_name www.arcanebyte.com localhost;
    root        /usr/share/nginx/arcanebyte;
    index       index.html;

    add_header  Cache-Control          $cache_control always;
    add_header  X-Content-Type-Options nosniff        always;
    add_header  Referrer-Policy        strict-origin-when-cross-origin always;

    # Hugo writes pretty URLs as directories; try the file, then the directory.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}

# apex -> www, so the site has one canonical hostname
server {
    listen      80;
    server_name arcanebyte.com;
    return      301 https://www.arcanebyte.com$request_uri;
}

