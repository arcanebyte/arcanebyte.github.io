{{ define "main" }}
<div class="wrap band" style="text-align:center">
  <h1>That page isn't here</h1>
  <p class="typed" style="margin-top:1rem">Error 404. It may have moved when the site was rebuilt.</p>
  <div class="btn-row" style="justify-content:center;margin-top:1.75rem">
    <a class="btn btn--primary" href="{{ "/" | relURL }}">Home</a>
    {{- /* Second link comes from the site's own menu, so this template stays
           usable by any site that shares the theme. */}}
    {{- with index (.Site.Menus.main) 0 }}
    <a class="btn" href="{{ .URL }}">{{ .Name }}</a>
    {{- end }}
  </div>
</div>
{{ end }}
