{{ define "main" }}
<div class="wrap wrap--narrow page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Params.lede }}<p class="page-head__lede">{{ . }}</p>{{ end }}
</div>
<div class="wrap wrap--narrow band">
  <div class="faq">
    {{- range hugo.Data.faq.questions }}
    <details>
      <summary>{{ .q }}</summary>
      <div>{{ .a | markdownify }}</div>
    </details>
    {{- end }}
  </div>
  {{- with .Content }}<div class="prose" style="margin-top:2.5rem">{{ . }}</div>{{ end }}
</div>
{{ end }}
