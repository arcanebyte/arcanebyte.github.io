questions:
  - q: "How do I purchase items from ArcaneByte?"
    a: |
      We offer a variety of products through major online 'maker' sites such as Etsy and
      Tindie, as well as eBay. Most products can also be bought directly from this site
      with PayPal checkout. If you'd like to order directly and bypass the middleman,
      please [contact us](/contact/).
  - q: "How do I return my product?"
    a: |
      All products we sell are handmade and tested prior to shipping, but sometimes
      things happen. ArcaneByte offers a 30-day return window, no questions asked. All we
      ask is that you pay return shipping and return the item in 'like' condition. We
      reserve the right to refuse returns if the item is damaged in any way. Please
      [contact us](/contact/) for an RMA.
  - q: "How do I replace my item under warranty?"
    a: |
      ArcaneByte provides a 30-day warranty on most items we sell. If you're having
      issues with your item, please [contact us](/contact/).
  - q: "How long does shipping take?"
    a: |
      Please allow up to two days for your order to ship. A tracking number will be
      provided via email once your order has shipped.
